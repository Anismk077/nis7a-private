services:
  nis7a:
    build: .
    container_name: nis7a-app
    expose:
      - "8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: nis7a-caddy
    depends_on:
      - nis7a
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: