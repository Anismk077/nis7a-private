<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NIS7A</title>
  <style>
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#060b16;color:#f5f8ff}
    .wrap{max-width:1000px;margin:0 auto;padding:32px 20px 64px}
    .hero{padding:48px 0}
    h1{font-size:48px;line-height:1.05;margin:0 0 16px}
    p{color:#b6c2d6;line-height:1.7}
    .btn{display:inline-block;margin-top:18px;padding:12px 18px;border-radius:12px;background:#67d3ff;color:#072033;text-decoration:none;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:26px}
    .card{border:1px solid #24344f;border-radius:16px;padding:16px;background:#0c1424}
    @media (max-width:800px){h1{font-size:34px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>NIS7A</h1>
      <p>Un lecteur multimedia plus fluide, plus propre, pense pour votre console.</p>
      <a class="btn" href="#">Telecharger l'APK</a>
      <div class="grid">
        <article class="card"><h3>Bibliotheque</h3><p>Acces rapide a vos contenus.</p></article>
        <article class="card"><h3>Hors connexion</h3><p>Visionnage offline apres telechargement.</p></article>
        <article class="card"><h3>Reprise</h3><p>Continuez la lecture ou vous etiez.</p></article>
      </div>
    </section>
  </main>
</body>
</html>
